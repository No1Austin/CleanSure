<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanSure | Administration</title><link rel="stylesheet" href="admin.css"></head><body><header><a href="/" class="brand">✦ CleanSure</a><span>Operations dashboard</span><button id="logout" hidden>Sign out</button></header><main><section id="loginPanel" class="login panel"><h1>Welcome back</h1><p>Sign in with your approved CleanSure administrator account.</p><form id="loginForm"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in securely</button></form><p id="loginMessage" role="status"></p></section><section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">CLEANSURE OPERATIONS</p><h1>Booking overview</h1><p>Review incoming cleaning requests and cleaner applications.</p></div><button id="refresh">Refresh data ↻</button></div><div class="stats"><article><small>Total bookings</small><strong id="countAll">—</strong></article><article><small>New requests</small><strong id="countNew">—</strong></article><article><small>Pending applications</small><strong id="countApps">—</strong></article></div><div class="tabs"><button class="active" data-tab="bookings">Bookings</button><button data-tab="applications">Cleaner applications</button></div><p id="status" role="status"></p><div id="bookings" class="records"></div><div id="applications" class="records" hidden></div></section></main><script src="admin.js"></script></body></html>
